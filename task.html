    <!-- 1. create a full width dark header with a center,uppercase white heading
     2. add a welcome inside a container 
     3. display three event cards 
     4.apply different padding,margins,widths,borders,rounded corners and shadows to the cards 
     5.arrange the cards horizontally using display 
     6.add a registration notice with a danger background and white text 
     7.position a new label at the top right corner of the notice
     8.add a fixed a help button at the bottom right corner -->

    
     <div class="bg-dark text-white text-center p-4 fs-4 ">COLLEGE TECHNICAL FEST</div>
     <div >
        <H2 class="text-primary text-center" >Welcome To Technical Fest </H2>
        <div class="d-inline-block ms-4 bg-primary text-white p-3 w-25 border border-dark border-3 rounded shadow-md">
            <h4 class="text-center">Coding</h4>
            <p class="text-center fst-italic">programming</p>
        </div>

        <div class="d-inline-block m-3 bg-success text-white p-3 w-25 border border-warning border-3 rounded shadow-md">
            <h4 class="text-center">Robotics</h4>
            <p class="text-center fst-italic">robotics workshop</p>
        </div>

        <div class="d-inline-block m-3 bg-warning text-dark p-3 w-25 border border-danger border-3 rounded shadow-md">
            <h4 class="text-center">Technical quiz</h4>
            <p class="text-center fst-italic">test your knowledge</p>
        </div>

        <div class="position-relative container bg-danger text-white p-4 mt-5 rounded">
            <span class="position-absolute top-0 end-0 bg-warning text-dark p-2">NEW</span>
            <h2 class="text-center">REGISTRATION OPEN</h2>
            <p class="text-center">last date:18 December-2026</p>
        </div>

<br>
        <div class="border border-1 container p-3">
            <div class="bg-primary container-fluid text-white p-2">block element</div>
            <div class="d-inline bg-success text-white p-1">Inline</div>
            <div class="d-inline-block  bg-warning text-white p-1 ">Inline block</div>
        </div>

        <div class="position-relative  bg-dark text-white text-center p-1 fs-5 ">Technical Fest 2026

        </div>

        <span class="position-absolute border border-1 text-white bg-primary  end-0 p-1 mb-1">help</span>

     </div>

     
</body>
